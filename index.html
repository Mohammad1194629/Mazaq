<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مطعم مذاق الموصل | المنيو الإلكتروني</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background-color: #0F172A; color: #F8FAFC; padding-bottom: 80px; }
    .header { background: #1E293B; padding: 20px; text-align: center; border-bottom: 2px solid #D64C31; }
    .header h1 { color: #F59E0B; font-size: 22px; margin-bottom: 5px; }
    .header p { color: #94A3B8; font-size: 13px; }
    .container { padding: 16px; max-width: 800px; margin: 0 auto; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; margin-top: 20px; }
    .card { background: #1E293B; border-radius: 12px; overflow: hidden; border: 1px solid #334155; display: flex; flex-direction: column; }
    .card img { width: 100%; height: 120px; object-fit: cover; }
    .card-body { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 14px; font-weight: 700; color: #F8FAFC; margin-bottom: 6px; }
    .card-category { font-size: 11px; color: #D64C31; margin-bottom: 8px; font-weight: 600; }
    .card-price { font-size: 13px; font-weight: 800; color: #22C55E; }
    .loading-spinner { text-align: center; color: #94A3B8; padding: 40px; font-size: 14px; }
  </style>
</head>
<body>

  <header class="header">
    <h1>🍽️ مطعم مذاق الموصل</h1>
    <p>أهلاً بكم - تصفح أشهى الأطباق الموصلية والمأكولات الطازجة</p>
  </header>

  <div class="container">
    <div id="loading" class="loading-spinner">⏳ جاري تحميل الأطباق...</div>
    <div id="menuGrid" class="menu-grid"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDSEuSjIN1P6AxgpXts1yDSxHu4bdaf8xs",
      authDomain: "mazaq-restaurant-40ed3.firebaseapp.com",
      projectId: "mazaq-restaurant-40ed3",
      storageBucket: "mazaq-restaurant-40ed3.firebasestorage.app",
      messagingSenderId: "751899653905",
      appId: "1:751899653905:web:0aad8440f5d3eb5e633eb0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function fetchMenuFromCloud() {
      const menuGrid = document.getElementById('menuGrid');
      const loading = document.getElementById('loading');

      try {
        const querySnapshot = await getDocs(collection(db, "menu_items"));
        loading.style.display = 'none';
        menuGrid.innerHTML = '';

        if (querySnapshot.empty) {
          menuGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#94A3B8;">لا توجد أطباق معروضة حالياً.</p>';
          return;
        }

        querySnapshot.forEach((doc) => {
          const item = doc.data();
          menuGrid.innerHTML += `
            <div class="card">
              <img src="${item.img || 'https://via.placeholder.com/150'}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/150'">
              <div class="card-body">
                <div>
                  <div class="card-category">${item.category || 'عام'}</div>
                  <div class="card-title">${item.name}</div>
                </div>
                <div class="card-price">${item.price} د.ع</div>
              </div>
            </div>
          `;
        });
      } catch (error) {
        loading.innerText = 'حدث خطأ في تحميل البيانات من السحابة.';
        console.error(error);
      }
    }

    fetchMenuFromCloud();
  </script>
</body>
</html>
