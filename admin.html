<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>لوحة التحكم السحابية | مطعم مذاق الموصل</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background-color: #1E293B; color: #F8FAFC; padding-top: 65px; padding-bottom: 30px; }
    .admin-header { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #0F172A; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; z-index: 100; }
    .admin-title { font-size: 15px; font-weight: 800; color: #F59E0B; }
    .container { padding: 16px; max-width: 800px; margin: 0 auto; }
    .admin-tabs { display: flex; gap: 8px; margin-bottom: 16px; background: #0F172A; padding: 4px; border-radius: 12px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: none; color: #94A3B8; font-family: 'Cairo'; font-weight: 700; font-size: 12px; border-radius: 8px; cursor: pointer; text-align: center; }
    .tab-btn.active { background: #D64C31; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .form-card { background: #334155; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #CBD5E1; }
    .form-control { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #1E293B; color: white; font-family: 'Cairo'; font-size: 13px; outline: none; }
    .action-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-family: 'Cairo'; font-size: 13px; font-weight: bold; cursor: pointer; color: white; background: #16A34A; }
    .item-card { background: #334155; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .btn-delete-item { background: #EF4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-family: 'Cairo'; cursor: pointer; font-size: 11px; }
  </style>
</head>
<body>

  <header class="admin-header">
    <div class="admin-title">☁️ لوحة التحكم السحابية - مذاق الموصل</div>
    <span id="cloudStatus" style="font-size: 11px; color: #22C55E;">● متصل بالسحابة</span>
  </header>

  <div class="container">
    <div class="admin-tabs">
      <button class="tab-btn active">🍲 الأطباق والمنتجات</button>
    </div>

    <div id="admin-products" class="tab-content active">
      <div class="form-card">
        <h4 style="font-size: 14px; margin-bottom: 10px; color: #F59E0B;">➕ إضافة طبق جديد لقاعدة البيانات السحابية</h4>
        <div class="form-group">
          <label>اسم الطبق:</label>
          <input type="text" id="prodName" class="form-control" placeholder="مثال: كباب موصلي">
        </div>
        <div class="form-group">
          <label>السعر (دينار):</label>
          <input type="number" id="prodPrice" class="form-control" placeholder="12000">
        </div>
        <div class="form-group">
          <label>رابط الصورة (URL):</label>
          <input type="text" id="prodImg" class="form-control" placeholder="ضع رابط الصورة هنا">
        </div>
        <div class="form-group">
          <label>القسم:</label>
          <select id="prodCat" class="form-control">
            <option value="الأكلات الموصلية">الأكلات الموصلية</option>
            <option value="المشويات">المشويات</option>
            <option value="المعجنات والبيتزا">المعجنات والبيتزا</option>
            <option value="الحلويات">الحلويات</option>
            <option value="المشروبات">المشروبات</option>
          </select>
        </div>
        <button class="action-btn" onclick="saveProductToCloud()">حفظ وإضافة فورية للمنيو ☁️</button>
      </div>

      <h4 style="font-size: 14px; margin-bottom: 10px; color: #CBD5E1;">الأطباق المضافة في السحابة:</h4>
      <div id="cloudProductsList">جاري تحميل البيانات...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDSEuSjIN1P6AxgpXts1yDSxHu4bdaf8xs",
      authDomain: "mazaq-restaurant-40ed3.firebaseapp.com",
      projectId: "mazaq-restaurant-40ed3",
      storageBucket: "mazaq-restaurant-40ed3.firebasestorage.app",
      messagingSenderId: "751899653905",
      appId: "1:751899653905:web:0aad8440f5d3eb5e633eb0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.saveProductToCloud = async function() {
      const name = document.getElementById('prodName').value;
      const price = document.getElementById('prodPrice').value;
      const img = document.getElementById('prodImg').value;
      const cat = document.getElementById('prodCat').value;

      if (!name || !price) return alert('يرجى ملء الاسم والسعر!');

      try {
        await addDoc(collection(db, "menu_items"), {
          name: name,
          price: price,
          img: img || 'https://via.placeholder.com/150',
          category: cat,
          createdAt: new Date()
        });
        alert('✅ تم حفظ المنتج في السحابة وظهر فوراً للزبائن!');
        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodImg').value = '';
        loadCloudProducts();
      } catch (e) {
        alert('خطأ في الحفظ: ' + e.message);
      }
    };

    window.loadCloudProducts = async function() {
      const listDiv = document.getElementById('cloudProductsList');
      listDiv.innerHTML = 'جاري التحميل...';
      const querySnapshot = await getDocs(collection(db, "menu_items"));
      listDiv.innerHTML = '';
      if(querySnapshot.empty) {
        listDiv.innerHTML = '<p style="color:#94A3B8; font-size:12px;">لا توجد أطباق مضافة حتى الآن.</p>';
        return;
      }
      querySnapshot.forEach((docSnapshot) => {
        const item = docSnapshot.data();
        listDiv.innerHTML += `
          <div class="item-card">
            <div>
              <b>${item.name}</b> - ${item.price} د.ع <br>
              <small style="color: #94A3B8;">القسم: ${item.category}</small>
            </div>
            <button class="btn-delete-item" onclick="deleteProductFromCloud('${docSnapshot.id}')">حذف 🗑️</button>
          </div>
        `;
      });
    };

    window.deleteProductFromCloud = async function(id) {
      if(confirm('هل انت متاكد من حذف هذا الطبق نهائياً؟')) {
        await deleteDoc(doc(db, "menu_items", id));
        loadCloudProducts();
      }
    };

    loadCloudProducts();
  </script>
</body>
</html>
